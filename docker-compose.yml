services:
  mongo:
    image: mongo:7
    container_name: usage-mongo
    restart: unless-stopped
    ports:
      # Host port 27018, so this stack can run alongside job-tracker's, which
      # uses the default 27017. Inside the container Mongo still listens on
      # 27017 - only the host-side mapping differs.
      - '27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: usage-redis
    restart: unless-stopped
    ports:
      # 6380 for the same reason - job-tracker's Redis holds 6379.
      - '6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
